[project]
name = "pitcic-segmentation"
version = "1.0.0"
description = "Reproduction code for land cover segmentation feeding a terrain traversability estimator (PITCIC, IME / Brazilian Army)"
requires-python = ">=3.11"
dependencies = [
    "tensorflow==2.21.0",
    "numpy>=1.26",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "requests>=2.31",
    "tqdm>=4.66",
]

[project.optional-dependencies]
kaggle = ["kaggle>=1.6"]
# Reading GeoTIFFs: the dataset's full integrity check and any georeferenced
# output. Not needed to reproduce the reported numbers, which run off the PNGs.
geo = ["rasterio>=1.3", "geopandas>=0.14", "shapely>=2.0"]
figures = ["matplotlib>=3.8", "jupyter>=1.0", "nbstripout>=0.7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
pitcic-eval = "pitcic.eval.cli:main"
